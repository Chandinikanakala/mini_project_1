<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>

        body {
            font-family: Arial;
            background: linear-gradient(135deg, #d4fc79, #96e6a1);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 350px;
        }

        h1 {
            text-align: center;
            color: green;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Sign Up</h1>

        <input type="text"
               id="username"
               placeholder="Username">

        <input type="password"
               id="password"
               placeholder="Password">

        <button onclick="signup()">
            Create Account
        </button>

    </div>

    <script>

        function signup() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            if (username !== "" && password !== "") {

                localStorage.setItem(
                    "username",
                    username
                );

                localStorage.setItem(
                    "password",
                    password
                );

                alert(
                    "Account created successfully!"
                );

                window.location.href =
                    "login.html";

            }

            else {

                alert(
                    "Please fill all fields."
                );

            }

        }

    </script>

</body>
</html>
